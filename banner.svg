<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AI Automation Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1D3D"/>
      <stop offset="55%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="360" fill="#0066FF"/>

  <g opacity="0.5">
    <circle cx="1050" cy="110" r="86" fill="none" stroke="#0066FF" stroke-width="1.5"/>
    <circle cx="1050" cy="110" r="132" fill="none" stroke="#0066FF" stroke-width="1" opacity="0.5"/>
    <circle cx="1050" cy="110" r="6" fill="#0066FF"/>
  </g>

  <text x="76" y="140"
        font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="57" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">AI AUTOMATION ENGINEER</text>

  <text x="78" y="188"
        font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="20" font-weight="600" fill="#0066FF" letter-spacing="6">ENGINEERED DIFFERENTLY</text>

  <rect x="78" y="206" width="240" height="3" fill="url(#rule)"/>

  <text x="78" y="260"
        font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="34" font-weight="800" fill="#0066FF" letter-spacing="0.5">I BUILD. I SHIP. I DEPLOY.</text>

  <text x="78" y="314"
        font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="26" font-weight="500" fill="#9FB3CE">Agents · LLM integrations · Workflow automation</text>

  <text x="1124" y="332" text-anchor="end"
        font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#6E86A8" letter-spacing="2.5">REMOTE · WAT (UTC+1)</text>
</svg>
